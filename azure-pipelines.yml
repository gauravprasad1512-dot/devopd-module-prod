trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- checkout: self

# Install Terraform
- bash: |
    wget -q https://releases.hashicorp.com/terraform/1.12.2/terraform_1.12.2_linux_amd64.zip
    unzip -o terraform_1.12.2_linux_amd64.zip
    sudo mv terraform /usr/local/bin/
    terraform --version
  displayName: 'Install Terraform'

# Check Terraform
- script: |
    terraform --version
  displayName: 'Check Terraform Version'

# Terraform Init
- script: |
    terraform init
  workingDirectory: Parent_module
  displayName: 'Terraform Init'

# Terraform Validate
- script: |
    terraform validate
  workingDirectory: Parent_module
  displayName: 'Terraform Validate'

# Terraform Plan
- task: AzureCLI@2
  displayName: 'Terraform Plan'
  inputs:
    azureSubscription: 'Azure-Terraform-Connectiona'
    scriptType: bash
    scriptLocation: inlineScript
    workingDirectory: '$(System.DefaultWorkingDirectory)/Parent_module'
    inlineScript: |
      terraform plan -input=false